// Foojay toolchain resolver — auto-downloads JDK 21 on hosts that don't have one.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'nip-ca-server'

// Composite build: prefer the canonical monorepo SDK and fall back to the
// sibling standalone SDK after this example is materialized for distribution.
// This avoids duplicating NipX509Builder / AcmeServer while keeping both tree
// layouts directly buildable.
def monorepoSdk = file('../../../../impl/java')
def standaloneSdk = file('../../../NPS-SDK-Java')
def sdkBuild = monorepoSdk.isDirectory() ? monorepoSdk : standaloneSdk
if (!sdkBuild.isDirectory()) {
    throw new GradleException(
        'NPS Java SDK not found; expected ../../../../impl/java or ../../../NPS-SDK-Java')
}
includeBuild(sdkBuild)
