version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       nipca
      POSTGRES_USER:     nipca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nipca -d nipca"]
      interval: 10s
      timeout: 5s
      retries: 5

  nip-ca:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${NIP_PORT:-17435}:17435"
      - "127.0.0.1:17436:17436"   # management port: /metrics, /healthz, /readyz (host-local only)
    volumes:
      - ca_keys:/data
    environment:
      NIPCA__CANID:            ${NIPCA__CANID:?NIPCA__CANID is required}
      NIPCA__KEYPASSPHRASE:    ${NIPCA__KEYPASSPHRASE:?NIPCA__KEYPASSPHRASE is required}
      NIPCA__BASEURL:          ${NIPCA__BASEURL:?NIPCA__BASEURL is required}
      CONNECTIONSTRINGS__POSTGRES: "Host=postgres;Database=nipca;Username=nipca;Password=${POSTGRES_PASSWORD}"
      NIPCA__DISPLAYNAME:      ${NIPCA__DISPLAYNAME:-NPS CA}
      NIPCA__AGENTCERTVALIDITYDAYS: ${NIPCA__AGENTCERTVALIDITYDAYS:-30}
      NIPCA__NODECERTVALIDITYDAYS:  ${NIPCA__NODECERTVALIDITYDAYS:-90}
      NIPCA__RENEWALWINDOWDAYS:     ${NIPCA__RENEWALWINDOWDAYS:-7}
      NIPCA__MGMT_ADDR:        "0.0.0.0:17436"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:17436/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pg_data:
  ca_keys:
